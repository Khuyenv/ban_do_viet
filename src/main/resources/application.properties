spring.application.name=ban_do_viet

# Cấu hình JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Cho phép reload JSP không cần restart server khi phát triển
server.servlet.jsp.init-parameters.development=true

# Cổng khởi chạy ứng dụng
# Render yêu cầu dùng biến $PORT động, fallback 8080 khi chạy local
server.port=${PORT:8080}

